# pre-commit：本地 commit 前跑與 CI 同套檢查（ruff + eslint），把紅燈提前到 commit 時。
# 啟用（一次性）：cd backend && .venv/bin/pip install pre-commit && cd .. && backend/.venv/bin/pre-commit install
# 全量檢查：backend/.venv/bin/pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        # ⚠️ 必須先 cd 進 frontend/ 再跑，不能用 `pnpm -C frontend/apps/console`：
        # pnpm 的版本解析發生在 `-C` **之前**——從 repo 根啟動時讀不到
        # frontend/package.json 的 `packageManager`，會以全域版本啟動，接著發現目標專案釘的是
        # 另一版卻已經切不回去（corepack 不支援中途換版），於是 eslint 根本沒跑就 exit 1。
        # 從 frontend/ 啟動則能正確自動切到釘住的版本。
        entry: bash -c 'cd frontend && pnpm --filter console lint'
        language: system
        files: ^frontend/.*\.(ts|vue|js)$
        pass_filenames: false
